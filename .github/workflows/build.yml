name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish
        run: dotnet publish RgbStudio.csproj -c Release -o publish
      - name: Zip
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path publish\* -DestinationPath "RGBStudio-$v-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RGBStudio-win-x64
          path: RGBStudio-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $extra = @()
          if ($env:GITHUB_REF_NAME -like '*-*') { $extra += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME (Get-Item RGBStudio-*.zip).FullName --title "RGB Studio $env:GITHUB_REF_NAME" --generate-notes @extra
